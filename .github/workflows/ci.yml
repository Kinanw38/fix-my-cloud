name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to major tags. SHA pinning is stricter.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run privacy

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test --project=chromium --project=firefox

  # WebKit (Safari's engine) is best effort. It reports a result but never blocks anything.
  e2e-webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit
